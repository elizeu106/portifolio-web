<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Escolha um Portfólio</title>

    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color:white;
    }

    .container{
        text-align:center;
        background: rgba(255,255,255,0.05);
        padding:50px;
        border-radius:20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 25px rgba(0,0,0,0.3);
        width: 400px;
    }

    h1{
        margin-bottom:30px;
        font-size:2rem;
    }

    .botoes{
        display:flex;
        flex-direction:column;
        gap:20px;
    }

    .btn{
        text-decoration:none;
        background:#2563eb;
        color:white;
        padding:15px;
        border-radius:12px;
        font-size:1.1rem;
        transition:0.3s;
        font-weight:bold;
    }

    .btn:hover{
        background:#3b82f6;
        transform:scale(1.03);
    }

    .em-breve{
        background:#475569;
    }

    .em-breve:hover{
        background:#64748b;
    }
    </style>
</head>
<body>

    <div class="container">
    <h1>Escolha qual portfólio acessar</h1>

    <div class="botoes">

        <!-- PORTFÓLIO ELIZEU -->
        <a href="portfolio-elizeu/index.html" class="btn">
        Portfólio Elizeu
        </a>

        <!-- PORTFÓLIO IURI -->
        <a href="portfolio-iuri/index.html" class="btn em-breve">
        Portfólio Iuri
        </a>

    </div>
    </div>

</body>
</html>
